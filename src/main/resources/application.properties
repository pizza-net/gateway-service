spring.application.name=gateway-service

# Server Configuration
server.port=8080

# Config Server (optional - może być używany do centralnej konfiguracji)
spring.config.import=optional:configserver:http://config-server:8888
spring.cloud.config.fail-fast=false

spring.cloud.config.retry.initial-interval=2000
spring.cloud.config.retry.multiplier=1.5  
spring.cloud.config.retry.max-interval=5000 
spring.cloud.config.retry.max-attempts=20

# Eureka Client Configuration (optional - dla service discovery)
eureka.client.service-url.defaultZone=http://discovery-server:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Logging
logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.com.pizzanet.gatewayservice=DEBUG  